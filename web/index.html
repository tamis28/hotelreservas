<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Tami</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <aside class="sidebar">
        <br>
        <h2>Hotel Tami</h2>
        <p>Reservas</p>
        <hr>

        <br>
        <br>

        <button class="menu active">
            Quartos
        </button>

        <button class="menu">
            Reservas
        </button>
    </aside>

    <main>

        <div class="topo">

            <div>
                <br><br>
                <h1>Quartos Cadastrados</h1>
                <p>Gerencie os quartos do hotel</p>
            </div>

            <button onclick="abrirModalQuarto()">
                + Novo Quarto
            </button>

        </div>

        <br><br>

        <table>

            <thead>
                <tr>
                    <th>ID</th>
                    <th>Número</th>
                    <th>Tipo</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody id="listaQuartos"></tbody>

        </table>

    </main>

</div>

<div class="modal" id="modalQuarto">

    <div class="modal-content">

        <h2>Novo Quarto</h2>

        <input type="number" id="numeroQuarto" placeholder="Número">

        <select id="tipoQuarto">
            <option>Selecione</option>
            <option>Suíte solteiro</option>
            <option>Suíte casal</option>
            <option>Suíte vip</option>
            <option>Suíte luxo</option>
        </select>

        <button onclick="salvarQuarto()">
            Salvar
        </button>

        <button onclick="fecharModalQuarto()">
            Cancelar
        </button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
